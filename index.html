<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NeuralGrid — Login</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body class="login-page">
  <div class="grid-bg"></div>

  <div class="login-container">
    <div class="login-brand">
      <div class="brand-icon">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <polygon points="20,2 38,32 2,32" stroke="#00e5a0" stroke-width="2" fill="none"/>
          <polygon points="20,10 32,30 8,30" fill="#00e5a0" opacity="0.15"/>
          <line x1="20" y1="2" x2="20" y2="38" stroke="#00e5a0" stroke-width="1.5" stroke-dasharray="3,3"/>
          <circle cx="20" cy="20" r="3" fill="#00e5a0"/>
        </svg>
      </div>
      <h1 class="brand-name">NEURALGRID</h1>
      <p class="brand-sub">Electricity Theft Detection System</p>
    </div>

    <div class="login-card">
      <div class="login-card-header">
        <span class="status-dot"></span>
        <span class="mono">SECURE ACCESS</span>
      </div>

      <div class="login-fields">
        <div class="field-group">
          <label class="mono">USER ID</label>
          <input type="text" id="username" placeholder="Enter operator ID" autocomplete="off"/>
        </div>
        <div class="field-group">
          <label class="mono">PASSKEY</label>
          <input type="password" id="password" placeholder="••••••••"/>
        </div>
       <div class="login-hint" style="color: var(--muted); font-size: 0.65rem;">
  Authorized GESCOM administrative personnel access only.
</div>
      </div>

      <button class="login-btn" onclick="handleLogin()">
        <span>AUTHENTICATE</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12,5 19,12 12,19"/>
        </svg>
      </button>

      <div class="login-error mono" id="loginError">⚠ Invalid credentials</div>
    </div>

    <p class="login-footer mono">NeuralGrid v1.0 · Shetty Institute of Technology · 2025</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
